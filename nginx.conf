server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 101m;

    # Access control for a published deployment. This glob matches nothing in a
    # fresh checkout, so local development stays open; a deployment mounts an
    # auth.conf here that turns on basic auth for everything below. Applied at
    # server level so it covers the page, /api/ and /videos/ alike -- an app
    # with no authentication of its own must not be gated only on its front door.
    include /etc/nginx/app-auth/*.conf;

    # Never let the object store's content be reinterpreted by the browser.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt's HTTP-01 challenge. Exempt from auth and placed before
    # everything else: certbot's validator arrives with no credentials, so the
    # gate in deploy/auth would 401 it and issuance fails with an error that
    # does not mention authentication at all.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Container healthcheck target. Exempt from auth: the healthcheck runs
    # inside the container with no credentials, and a 401 would mark an
    # otherwise healthy service as failed and stall everything that waits on it.
    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location /videos/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        # $http_host, not $host: it keeps the port, and MinIO validates the
        # presigned SigV4 signature against the exact host it was signed for.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
