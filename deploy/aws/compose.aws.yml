# AWS overlay: what changes when the stack runs on the Terraform host in
# infra/terraform. Layered over docker-compose.yml, never instead of it:
#
#   docker compose -f docker-compose.yml -f deploy/aws/compose.aws.yml \
#     up -d --build --scale worker=2
#
# A separate file rather than edits to docker-compose.yml, so the stack every
# developer runs is untouched and nobody's MinIO setup depends on AWS.
#
# Storage endpoints, the bucket and the region come from .env -- see
# deploy/aws/env.aws.example.

x-instance-role: &instance-role
  # Credentials from the EC2 instance role. MINIO_ACCESS_KEY and
  # MINIO_SECRET_KEY are ignored when this is on.
  STORAGE_USE_INSTANCE_ROLE: "true"

services:
  # S3 replaces MinIO here, but the `minio` name must still resolve: nginx's
  # /videos/ location names it as an upstream, and nginx refuses to start
  # when one does not resolve. A placeholder answers to the name and holds
  # nothing. It also sidesteps the MinIO image no registry will serve
  # anonymously any more -- a fresh AWS host could not pull it.
  #
  # The base now builds MinIO from source, and Compose merges `build:` and
  # `pull_policy:` through from it -- without the resets, `--build` compiles
  # MinIO, tags it busybox:1.36, and runs `minio sleep infinity`.
  minio:
    build: !reset null
    pull_policy: !reset null
    image: busybox:1.36
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "true"]

  api:
    environment:
      <<: *instance-role
      # HLS segments through CloudFront once cdn.tf is applied; empty keeps
      # them on S3. Written by fetch-secrets.sh. Only the API signs URLs.
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY_B64: ${CLOUDFRONT_PRIVATE_KEY_B64:-}
      # Woken from zero as a job is queued (app/services/worker_wake.py).
      WORKER_GROUP_NAME: ${WORKER_GROUP_NAME:-}
      WORKER_GROUP_REGION: ${AWS_REGION:-}
      # Plays before a video gets its AV1 rendition (app/services/popularity.py);
      # 0 is off. The API counts the plays, so the switch is set here, not on
      # the workers.
      AV1_POPULAR_VIEWS: ${AV1_POPULAR_VIEWS:-0}
      # The longest upload the browser lets through: the API reports it
      # (app/api/limits.py). Must not exceed the workers' own setting in
      # infra/workers, or a video passes here and is refused after uploading.
      # Ten minutes on AWS, where the MP4 and the ladder are encoded in
      # pieces: 4:55 of 4K took 4 and 7.5 minutes (20 Oct 2026).
      MEDIA_MAX_DURATION_SECONDS: ${MEDIA_MAX_DURATION_SECONDS:-600}
      # Days a deleted video waits in the trash (0: delete at once). The API
      # and the reaper must agree: one trashes, the other empties.
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}

  worker:
    # A stopped worker gives its job back (app.worker.interruption) in a few
    # seconds, but a spot reclaim allows two minutes: use most of it before
    # Docker's SIGKILL, rather than the 10-second default.
    stop_grace_period: 100s
    environment:
      <<: *instance-role
      # The reason for the move: this host can encode a 4K ladder in time.
      WORKER_HLS_MAX_HEIGHT: ${WORKER_HLS_MAX_HEIGHT:-2160}
      WORKER_FFMPEG_MAX_HEIGHT: ${WORKER_FFMPEG_MAX_HEIGHT:-1080}
      # A 4K ladder is six renditions in one FFmpeg run; the 15-minute
      # budget sized for 720p is too tight. FFmpeg's own limit stays under
      # RQ's so the worker records a readable failure instead of being
      # killed mid-write.
      WORKER_FFMPEG_TIMEOUT_SECONDS: ${WORKER_FFMPEG_TIMEOUT_SECONDS:-1770}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-1800}

  reaper:
    environment:
      <<: *instance-role
      # Must outlast the longest job, or the reaper fails a job that is
      # still legitimately encoding.
      REAPER_LEASE_SECONDS: ${REAPER_LEASE_SECONDS:-2400}
      # A job the reaper puts back can wake an empty pool too.
      WORKER_GROUP_NAME: ${WORKER_GROUP_NAME:-}
      WORKER_GROUP_REGION: ${AWS_REGION:-}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
