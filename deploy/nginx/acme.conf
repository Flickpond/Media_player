# Let's Encrypt's HTTP-01 challenge. In its own file because it is needed by
# both the main server and the 80 -> 443 redirect server: renewal arrives over
# plain HTTP on the real hostname, so the redirect must serve this path rather
# than bounce it.
#
# Exempt from auth and matched with ^~ so it wins before anything else --
# certbot's validator has no credentials, and the gate would 401 it with an
# error that never mentions authentication.
location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /var/www/certbot;
    default_type "text/plain";
}
