name: DAST

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"
  # No `paths:` filter, so this scan can be a required check: a required
  # check whose workflow never starts leaves the PR waiting for it forever.
  # The `changes` job below decides instead, and a skipped job counts as passed.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Decide whether DAST is needed
    runs-on: ubuntu-latest
    outputs:
      scan: ${{ steps.diff.outputs.scan }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          # The PR merged into its base, plus both parents.
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "scan=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # deploy/dast/ holds the gate and its accepted findings, so editing
          # either has to run the gate it changes.
          pattern='^(\.github/workflows/dast\.yml|app/|deploy/(nginx|minio|dast)/|migrations/|docker-compose\.yml|Dockerfile|nginx\.conf|pyproject\.toml)'
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "${changed}"
          if printf '%s\n' "${changed}" | grep -Eq "${pattern}"; then
            echo "scan=true" >> "${GITHUB_OUTPUT}"
          else
            echo "scan=false" >> "${GITHUB_OUTPUT}"
          fi

  dast:
    name: OWASP ZAP API scan
    needs: changes
    # Scan when the diff calls for it, and also when the diff could not be
    # worked out: a broken `changes` job must not turn into a passed gate.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.scan == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: flickpond-dast-${{ github.run_id }}
      COMPOSE_FILE: docker-compose.yml
      JWT_SECRET: dast-only-jwt-secret-not-for-production-2026
      REDIS_PASSWORD: dast-only-redis-password
      POSTGRES_PASSWORD: dast-only-postgres-password
      DAST_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - name: Prepare report directory
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      - name: Start isolated application stack
        run: docker compose up --build -d --wait --wait-timeout 180 frontend

      - name: Prepare authenticated OpenAPI scan
        run: |
          curl --fail-with-body --silent --show-error \
            "${DAST_BASE_URL}/api/openapi.json" \
            | jq '.servers = [{"url": "http://127.0.0.1:3000/api"}]' \
            > zap-reports/openapi.json

          curl --fail-with-body --silent --show-error \
            --dump-header /tmp/dast-register-headers \
            --output /tmp/dast-register-body \
            --request POST "${DAST_BASE_URL}/api/auth/register" \
            --header "Content-Type: application/json" \
            --data '{"email":"dast@example.com","password":"Dast-only-password-123!"}'

          token="$(sed -nE 's/^set-cookie: access_token=([^;]+).*/\1/ip' \
            /tmp/dast-register-headers | tr -d '\r' | head -n 1)"
          if [ -z "${token}" ]; then
            cat /tmp/dast-register-body
            echo "Registration did not return an access_token cookie" >&2
            exit 1
          fi

          echo "::add-mask::${token}"
          echo "DAST_COOKIE=access_token=${token}" >> "${GITHUB_ENV}"

          curl --fail-with-body --silent --show-error \
            --header "Cookie: access_token=${token}" \
            "${DAST_BASE_URL}/api/auth/me" \
            | jq -e '.email == "dast@example.com"'

      - name: Run authenticated OWASP ZAP scan
        run: |
          set +e
          docker run --rm --network host \
            --volume "${PWD}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-api-scan.py \
            -t /zap/wrk/openapi.json \
            -f openapi \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -x zap-report.xml \
            -T 10 \
            -z "-config replacer.full_list(0).description=flickpond-auth \
              -config replacer.full_list(0).enabled=true \
              -config replacer.full_list(0).matchtype=REQ_HEADER \
              -config replacer.full_list(0).matchstr=Cookie \
              -config replacer.full_list(0).regex=false \
              -config replacer.full_list(0).replacement=${DAST_COOKIE}"
          status=$?
          set -e

          echo "ZAP_EXIT_CODE=${status}" >> "${GITHUB_ENV}"
          case "${status}" in
            0|1|2) ;;
            *)
              echo "ZAP failed to run (exit ${status})" >&2
              exit "${status}"
              ;;
          esac

      - name: Summarize ZAP findings
        if: always() && hashFiles('zap-reports/zap-report.json') != ''
        run: |
          high="$(jq '[.site[]?.alerts[]? | select(.riskcode == "3")] | length' zap-reports/zap-report.json)"
          medium="$(jq '[.site[]?.alerts[]? | select(.riskcode == "2")] | length' zap-reports/zap-report.json)"
          low="$(jq '[.site[]?.alerts[]? | select(.riskcode == "1")] | length' zap-reports/zap-report.json)"
          informational="$(jq '[.site[]?.alerts[]? | select(.riskcode == "0")] | length' zap-reports/zap-report.json)"
          {
            echo "## OWASP ZAP DAST"
            echo
            echo "| Risk | Alerts |"
            echo "| --- | ---: |"
            echo "| High | ${high} |"
            echo "| Medium | ${medium} |"
            echo "| Low | ${low} |"
            echo "| Informational | ${informational} |"
            echo
            echo "ZAP exit code: ${ZAP_EXIT_CODE:-unknown}. Medium and High findings block the merge unless deploy/dast/accepted-alerts.tsv accepts the rule; Low and Informational are report-only."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Blocking. ZAP's own exit code only says whether the scan ran: every
      # rule defaults to WARN, so it never reports a failure by itself.
      - name: Fail on unaccepted Medium or High findings
        run: |
          if [ ! -s zap-reports/zap-report.json ]; then
            echo "::error::ZAP wrote no JSON report, so nothing was checked."
            exit 1
          fi
          blocking="$(jq -r --rawfile accepted deploy/dast/accepted-alerts.tsv \
            -f deploy/dast/gate.jq zap-reports/zap-report.json)"
          if [ -z "${blocking}" ]; then
            echo "No unaccepted Medium or High findings."
            exit 0
          fi
          {
            echo
            echo "### Blocking findings"
            echo
            echo "| Risk | Rule | Alert | Instances | Example |"
            echo "| --- | --- | --- | ---: | --- |"
            printf '%s\n' "${blocking}" \
              | awk -F'\t' '{ printf "| %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5 }'
          } >> "${GITHUB_STEP_SUMMARY}"
          printf '%s\n' "${blocking}" | while IFS=$'\t' read -r risk rule name count uri; do
            echo "::error::ZAP ${risk} [${rule}] ${name}: ${count} instance(s), e.g. ${uri}"
          done
          exit 1

      - name: Capture application logs
        if: always()
        run: docker compose logs --no-color > zap-reports/compose.log 2>&1 || true

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports-${{ github.run_id }}
          path: zap-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Tear down isolated stack
        if: always()
        run: docker compose down -v --remove-orphans